<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#0f172a; --sub:#64748b;
    --brand:#0ea472; --brand-dark:#087a55; --accent:#2563eb; --accent2:#f59e0b;
    --danger:#e11d48; --line:#e2e8f0;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --card:#111a2b; --ink:#eef2f8; --sub:#93a2b8; --line:#1f2c42;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --card:#111a2b; --ink:#eef2f8; --sub:#93a2b8; --line:#1f2c42;
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  *{font-family:'Tajawal',system-ui,-apple-system,sans-serif;}
  body{background:var(--bg); color:var(--ink); min-height:100%; }
  .card{background:var(--card); border:1px solid var(--line); border-radius:1.25rem;}
  .pill{border-radius:9999px;}
  .chip{border-radius:9999px; padding:.4rem 1rem; font-size:.85rem; font-weight:700; cursor:pointer; transition:.15s; border:1.5px solid var(--line); background:var(--card); color:var(--ink);}
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .chip:hover{transform:translateY(-1px);}
  .type-card{border:2px solid var(--line); border-radius:1rem; padding:.9rem; cursor:pointer; transition:.15s; background:var(--card);}
  .type-card.active{border-color:var(--brand); background:rgba(14,164,114,.12);}
  .btn{border-radius:1rem; padding:.7rem 1.3rem; font-weight:800; transition:.15s; }
  .btn:active{transform:scale(.97);}
  .btn-brand{background:var(--brand); color:#fff;}
  .btn-brand:hover{background:var(--brand-dark);}
  .btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{background:rgba(100,116,139,.12);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .choice-btn{display:flex; align-items:center; gap:.6rem; width:100%; text-align:right; padding:.85rem 1rem; border-radius:1rem; border:2px solid var(--line); background:var(--card); color:var(--ink); font-weight:700; transition:.15s; cursor:pointer;}
  .choice-btn:hover{border-color:var(--accent);}
  .choice-btn.correct{border-color:var(--brand); background:rgba(14,164,114,.16); color:var(--brand-dark);}
  .choice-btn.wrong{border-color:var(--danger); background:rgba(225,29,72,.14); color:var(--danger);}
  .badge{font-size:.72rem; font-weight:800; padding:.2rem .6rem; border-radius:9999px;}
  .progress-track{background:var(--line); border-radius:9999px; overflow:hidden;}
  .progress-fill{background:linear-gradient(90deg,var(--brand),#22c55e); height:100%; transition:width .3s;}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .flip-card{perspective:1200px;}
  .flip-inner{position:relative; transition:transform .5s; transform-style:preserve-3d; min-height:220px;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:1.25rem; display:flex; align-items:center; justify-content:center; text-align:center; padding:1.5rem;}
  .flip-back{transform:rotateY(180deg);}
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:9999px;}
  .match-item{border:2px solid var(--line); border-radius:.9rem; padding:.6rem .9rem; cursor:pointer; background:var(--card); font-weight:700; font-size:.9rem; transition:.15s;}
  .match-item.sel{border-color:var(--accent); background:rgba(37,99,235,.14);}
  .match-item.done{border-color:var(--brand); background:rgba(14,164,114,.14); opacity:.6; cursor:default;}
  .match-item.bad{border-color:var(--danger); animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

  .fill-sentence{line-height:2.6;}
  .blank-line{display:inline-block; border:0; border-bottom:3px solid var(--ink); background:transparent; border-radius:0; text-align:center; font:inherit; font-weight:800; color:var(--brand-dark); padding:0 .3rem; margin:0 .3rem; outline:none; vertical-align:baseline; max-width:100%;}
  .blank-line:focus{border-bottom-color:var(--brand); background:rgba(14,164,114,.08);}
  .blank-line.ok{border-bottom-color:var(--brand); color:var(--brand-dark);}
  .blank-line.bad{border-bottom-color:var(--danger); color:var(--danger);}
  .blank-line:disabled{opacity:1;}

  #app{-webkit-user-select:none; user-select:none;}
  #app input,#app textarea,#app .selectable,.selectable{-webkit-user-select:text; user-select:text;}
  @media print{ body > *{display:none !important;} html::before{content:"🚫 الطباعة غير متاحة — راجع أسئلتك داخل التطبيق"; display:block; text-align:center; direction:rtl; font:bold 24px sans-serif; padding:80px 20px;} }

  .fig-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;margin:0 auto 14px;max-width:430px}
  .fig-wrap svg{width:100%;height:auto;display:block}
  .fig-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,.72fr);gap:12px;align-items:start;max-width:820px;margin:0 auto 14px}
  .fig-pair .fig-wrap{margin:0;max-width:none}
  .nose-detail{background:linear-gradient(145deg,#fff7f5,#fff);border:1px solid #f1c5ba;border-radius:14px;padding:10px;color:#7c2d12}
  .nose-detail svg{display:block;width:100%;height:auto;background:#fff;border-radius:10px}
  .nose-detail-title{font-weight:900;font-size:.95rem;margin-bottom:4px}
  .nose-detail-note{font-size:.72rem;line-height:1.7;color:#9a3412;margin-top:5px}
  @media (max-width:680px){.fig-pair{display:block}.nose-detail{margin:0 auto 14px;max-width:430px}}
  .lab-row{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;margin-bottom:6px;cursor:pointer}
  .lab-row.sel{border-color:#f59e0b;background:rgba(245,158,11,.12)}
  .lab-row.ok{border-color:#0ea472;background:rgba(14,164,114,.12)}
  .lab-row.bad{border-color:#e11d48;background:rgba(225,29,72,.10)}
  </style>
</head>

// ============================= أدوات عامة =============================
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function norm(s){
  return (s||'').toString()
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'') // تشكيل
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[.,،؛:؟!()"'«»]/g,'')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripAl(w){ return w.replace(/^(?:وال|بال|فال|كال|لل|ال)/,''); }
function tokN(s){ return norm(s).split(' ').filter(Boolean).map(stripAl); }
function fillOK(typed, ans){
  const tt = tokN(typed), at = tokN(ans);
  if(!tt.length) return false;
  const a = at.join(' '), t = tt.join(' ');
  if(a === t) return true;
  if(at.length === 1){
    return tt.some(w => w === a || (w.length>=3 && a.length>=3 && Math.abs(w.length-a.length)<=3 &&
      (w.endsWith(a)||a.endsWith(w)||w.startsWith(a)||a.startsWith(w))));
  }
  const hit = at.filter(w => tt.some(x => x === w || (x.length>=4 && w.length>=4 && (x.startsWith(w)||w.startsWith(x))))).length;
  return hit/at.length >= 0.7 && tt.length <= at.length + 2;
}
function countPool(topicIdxs, types){
  const ts = new Set(topicIdxs);
  return BANK.filter(q => ts.has(q.t) && types.has(q.k)).length;
}
function instantiate(q){
  const o = Object.assign({}, q, {kind: q.k, topic: TOPIC_TITLES[q.t]});
  if(q.k === 'mcq'){
    o.choices = shuffleArr([q.correct].concat(shuffleArr(q.ds).slice(0,3)));
  } else if(q.k === 'tf'){
    const useFalse = !!q.false && Math.random() < 0.5;
    o.shown = useFalse ? q.false : q.true;
    o.correct = !useFalse;
  } else if(q.k === 'match'){
    o.pairs = shuffleArr(q.pairs).slice(0, 6);
  }
  return o;
}
function buildQuestionPool(topicIdxs, types){
  const ts = new Set(topicIdxs);
  return BANK.filter(q => ts.has(q.t) && types.has(q.k)).map(instantiate);
}
function fillPlain(q){ return (q.ctx ? q.ctx + ' — ' : '') + q.pre + '________' + q.post; }
function reviewPrompt(q){
  if(q.kind === 'tf') return (q.qa ? esc(q.qa) + '<br><span style="font-weight:600">الإجابة المقترحة: ' + esc(q.shown) + '</span>' : esc(q.shown));
  if(q.kind === 'fill') return esc(fillPlain(q));
  return esc(q.prompt);
}
function reviewDetail(q, a){
  if(q.kind === 'mcq') return 'الصحيح: ' + esc(q.correct);
  if(q.kind === 'tf') return 'الصحيح: ' + (q.correct ? 'صح' : 'خطأ') + (q.correct ? '' : '<br>الصياغة الصحيحة: ' + esc(q.true));
  if(q.kind === 'fill') return 'الصحيح: ' + esc(q.pre) + '<b><u>' + esc(q.ans) + '</u></b>' + esc(q.post) + (a.typed ? '<br>كتبتَ: ' + esc(a.typed) : '');
  if(q.kind === 'recall') return '<span style="white-space:pre-line">الإجابة النموذجية: ' + esc(q.answer) + '</span>';
  if(q.kind === 'match') return 'نسبة التوصيل الصحيح: ' + Math.round((a.scoreVal||0)*100) + '%';
  return '';
}

// ليتنر: صندوق 1 (ضعيف) ← 5 (متقن). الصحيح يرفع الصندوق فتطول الفترة، والخطأ يعيده للصندوق 1.
function recordResult(q, ok){
  if(!q || !q.id) return;
  const p = PROG[q.id] || (PROG[q.id] = {box:0, seen:0, wrong:0, streak:0, book:false, due:0, mastered:false});
  p.seen++; p.last = Date.now();
  p.mastered = ok; // الإتقان يعتمد على آخر محاولة فقط: صحّح خطأه الآن = متقن فوراً
  if(ok){
    p.box = p.box === 0 ? 2 : Math.min(5, p.box + 1);
    p.streak++;
    if(p.streak >= 1) p.book = false;      // يخرج من الدفتر بمجرد أن يصححها مرة واحدة
  } else {
    p.box = 1; p.wrong++; p.streak = 0; p.book = true;
  }
  // موعد العودة تذكير اختياري لتثبيت المعلومة لاحقاً، ولا علاقة له بنسبة الإتقان المعروضة
  p.due = Date.now() + GAPS[p.box];
  saveProg();
}
function isDue(q){ const p = PROG[q.id]; return !!(p && p.seen && p.due <= Date.now()); }
function smartOrder(pool){
  const now = Date.now();
  const due = pool.filter(isDue).sort((a,b)=> (PROG[a.id].box - PROG[b.id].box) || (PROG[a.id].due - PROG[b.id].due));
  const fresh = shuffleArr(pool.filter(q => !PROG[q.id] || !PROG[q.id].seen));
  const later = pool.filter(q => PROG[q.id] && PROG[q.id].seen && PROG[q.id].due > now).sort((a,b)=> PROG[a.id].due - PROG[b.id].due);
  return due.concat(fresh, later);
}
const BOX_PCT = [0, 25, 50, 70, 85, 100];
// الإتقان الحقيقي للموضوع = إتقان جميع أسئلة الموضوع الفريدة تدريجياً.
// لا توجد عينة ثابتة مثل سؤالين من كل نوع؛ السؤال لا يُحسب متقناً إلا إذا أجيب عنه بشكل صحيح.
// يمكن للطالب الوصول إلى 100% على مدى أيام أو أسابيع، بينما يبقى التكرار المتباعد مسؤولاً عن تثبيت ما أتقنه.
function topicStats(i){
  const qs = BANK.filter(q => q.t === i);
  let seen = 0, mastered = 0, due = 0;
  qs.forEach(q => {
    const p = PROG[q.id];
    if(p && p.seen){
      seen++;
      if(p.mastered) mastered++;
      if(p.due <= Date.now()) due++;
    }
  });
  const pct = qs.length ? Math.round(mastered / qs.length * 100) : 0;
  const complete = qs.length > 0 && mastered === qs.length;
  return {
    total: qs.length, seen, due, mastered,
    pct, evidencePct: pct,
    satisfiedTypes: 0, typeCount: 0, complete, typeEvidence: {}
  };
}
function barColor(p){ return p < 40 ? '#e11d48' : (p < 70 ? '#f59e0b' : '#0ea472'); }
function startFromList(list, limit){

  const allowedList = list.filter(q => isTopicEnabled(q.t, state.mode));
  if(!allowedList.length && list.length){ alert('هذه المواضيع غير مفعّلة حاليًا من المعلم.'); return; }
  list = allowedList;
  clearActiveQuiz();
  let pool = smartOrder(list.map(instantiate));
  if(limit) pool = pool.slice(0, limit);

  state.quiz = {questions: pool, index:0, score:0, answers:[], answered:false, timer:null, remaining: state.secondsPerQuestion, startedAt: Date.now(), matchState:null};

}

  if(q.k === 'fill') return q.pre + q.ans + q.post;
  if(q.k === 'recall') return q.answer;
  return q.pairs.map(p => p[0] + ' ← ' + p[1]).join('\n');

  if(q.k === 'tf') return q.qa || (q.true.split(':')[0] + ' : ⋯');

  return q.prompt;
}

// ============================= رمز الإنجاز وشاشة المعلم =============================
const SALT = 'mnhj-1448-s7';
function b64u(t){ return btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(t){ t = t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length % 4) t += '='; return decodeURIComponent(escape(atob(t))); }
function chk(p){ return (hashStr(p + SALT) + hashStr(SALT + p.split('').reverse().join(''))).slice(0, 6); }
function makeToken(){
  const q = state.quiz, d = new Date(), pd = n => String(n).padStart(2, '0');
  const stamp = '' + d.getFullYear() + pd(d.getMonth()+1) + pd(d.getDate()) + pd(d.getHours()) + pd(d.getMinutes());
  const correct = q.answers.filter(a => a && a.correct).length;
  const mins = Math.max(1, Math.round((Date.now() - q.startedAt) / 60000));
  const clean = t => (t || '').trim().replace(/\|/g, ' ');
  const masteredTopics = TOPIC_TITLES.map((_,i) => topicStats(i).complete ? i : -1).filter(i => i >= 0).join(',');
  const fields = ['v3', clean(state.studentName), clean(state.studentClass), clean(state.studentNumber), stamp, correct, q.questions.length, mins];
  if(masteredTopics) fields.push(masteredTopics);
  const payload = fields.join('|');
  return b64u(payload) + '.' + chk(payload);
}
function copyToken(){
  const t = state.quiz.token;
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => alert('تم نسخ الرمز ✅'), () => prompt('انسخ الرمز:', t));
  else prompt('انسخ الرمز:', t);
}

function fetchRemoteConfigSilently(){
  const db = getTeacherDb();
  if(!db) return;
  db.collection('app_config').doc('grading').get().then(g => {
    if(g.exists){
      const t = ((g.data().currentTask || {}).title || '').trim();

      if(state.screen === 'setup') render();
    }
  }).catch(()=>{});
  db.collection('app_config').doc('settings').get().then(doc => {
    if(doc.exists){
      APP_CONFIG = normalizeConfig(doc.data());
      cacheConfig(APP_CONFIG);
      // لو المطلوب الشهري موجود ولسه الطالب ما اختار مواضيع، نفعّله تلقائيًا
      applyMonthlyPlanDefaultIfFresh();

      if(state.screen === 'setup') render();

}

function isTopicEnabled(i, mode){
  mode = mode || state.mode;
  const list = mode === 'exam' ? APP_CONFIG.examDisabledTopics : APP_CONFIG.practiceDisabledTopics;
  return !(list || []).includes(i);
}

function enabledTopicIndices(mode){
  return TOPIC_TITLES.map((_,i)=>i).filter(i => isTopicEnabled(i, mode));
}

// خطة الشهر: لو موجودة ومحدد فيها مواضيع، ولسه الطالب ما اختار شيء بنفسه
// (أول مرة يفتح فيها الإعداد)، نحدّدها له تلقائيًا كنقطة بداية
function applyMonthlyPlanDefaultIfFresh(){
  const plan = APP_CONFIG.monthlyPlan;
  if(!plan || !plan.topics || !plan.topics.length) return;
  if(state.selectedTopics && state.selectedTopics.size > 0) return;
  const valid = plan.topics.filter(i => isTopicEnabled(i, state.mode));
  if(valid.length) state.selectedTopics = new Set(valid);
}

// حالة الجلسة قبل الإرسال: كم سؤال لم يُحل، وكم إجابة خاطئة
function quizSendStatus(){
  const qz = state.quiz;
  const total = qz.questions.length;
  let unanswered = 0, wrong = 0, correct = 0;
  qz.questions.forEach((qq,i) => {
    const a = qz.answers[i];
    if(!a) unanswered++;
    else if(a.correct) correct++;
    else wrong++;
  });
  return {total, unanswered, wrong, correct};
}
function closeSendWarning(){ const d = document.getElementById('send-warning'); if(d) d.remove(); }
function showSendWarning(st){
  closeSendWarning();
  const parts = [];
  if(st.unanswered) parts.push('🔸 ' + st.unanswered + ' سؤال لم يُحل');
  if(st.wrong) parts.push('❌ ' + st.wrong + ' إجابة خاطئة تحتاج تصحيح');
  const div = document.createElement('div');
  div.id = 'send-warning';
  div.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  div.innerHTML = `<div class="card p-5" style="max-width:420px;width:100%;background:var(--card,#fff)">
    <h3 class="font-extrabold text-lg mb-2">⚠️ قبل إرسال الرمز للمعلم</h3>
    <p class="text-sm mb-1">نتيجتك الحالية: <b>${st.correct}</b> صحيحة من <b>${st.total}</b></p>
    <p class="text-sm mb-3" style="color:#b45309">${parts.join('<br>')}</p>
    <div class="grid gap-2">
      ${st.unanswered ? '<button onclick="resumeUnanswered()" class="btn btn-brand py-2.5">▶️ إكمال حل الأسئلة المتبقية</button>' : ''}
      ${st.wrong ? '<button onclick="closeSendWarning();retryWrong()" class="btn btn-brand py-2.5">🎯 تصحيح الأخطاء أولاً</button>' : ''}
      <button onclick="closeSendWarning();sendTokenToTeacher(true)" class="btn btn-outline py-2.5">📤 إرسال الرمز كما هو</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function resumeUnanswered(){
  closeSendWarning();
  const qz = state.quiz;
  const list = qz.questions.filter((qq,i) => !qz.answers[i]).map(qq => BYID[qq.id]).filter(Boolean);
  if(!list.length){ alert('ما فيه أسئلة متبقية.'); return; }
  startFromList(list, 0);
}

async function sendTokenToTeacher(force){

  }

    const decodedVersion = f[0] || 'v3';
    const decodedName = f[1] || '';
    const decodedClass = f[2] || '';
    const decodedStudentNumber = f[3] || '';
    const decodedTimestamp = f[4] || '';
    const correct = parseInt(f[5] || '0', 10) || 0;
    const total = parseInt(f[6] || '0', 10) || 0;
    const minutes = parseInt(f[7] || '0', 10) || 0;
    const mastered = f[8] ? f[8].split(',').filter(Boolean) : [];

    let attempted = [];
    try{ attempted = TOPIC_TITLES.map((_,i)=>i).filter(i => topicStats(i).seen > 0); }catch(e){}
    await db.collection('submissions').add({
      attempted,
      studentName: state.studentName || decodedName,
      studentClass: state.studentClass || decodedClass,
      rosterNumber: state.studentNumber || decodedStudentNumber,
      rawCode: token,
      decodedVersion, decodedName, decodedClass, decodedStudentNumber, decodedTimestamp,
      correct, total, minutes, mastered,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    btn.textContent = '✅ تم الإرسال للمعلم';
    msgEl.textContent = 'وصل رمزك للمعلم بنجاح. ما تحتاج تسويها مرة ثانية.';
    msgEl.className = 'text-xs mt-2';
    msgEl.style.color = '#0e8f5f';

    btn.disabled = false;
    btn.textContent = originalLabel;
    msgEl.textContent = 'تعذّر الإرسال (تأكد من الإنترنت). تقدر تنسخ الرمز وتبعثه يدويًا بدلاً من ذلك.';
    msgEl.className = 'text-xs mt-2';
    msgEl.style.color = '#e11d48';
  }
}

function verifyTokens(){
  const toks = document.getElementById('t-in').value.match(/[A-Za-z0-9_-]+\.[a-z0-9]{6}/g) || [];
  const rows = toks.map(t => {
    const [b, c] = t.split('.'); let p = null;
    try{ p = unb64u(b); }catch(e){}
    if(!p || chk(p) !== c) return {ok:false};
    const f = p.split('|');
    let nameIdx = 0, clsIdx = 1, noIdx = -1, stIdx = 2, cIdx = 3, nIdx = 4, mIdx = 5, masteredIdx = -1;
    if(f[0] === 'v3'){
      nameIdx = 1; clsIdx = 2; noIdx = 3; stIdx = 4; cIdx = 5; nIdx = 6; mIdx = 7; masteredIdx = 8;
    }else if(f[0] === 'v2'){
      nameIdx = 1; clsIdx = 2; noIdx = 3; stIdx = 4; cIdx = 5; nIdx = 6; mIdx = 7; masteredIdx = 8;
    }else if(f.length >= 7){
      masteredIdx = 6;
    }
    const st = f[stIdx], no = noIdx < 0 ? '' : (f[noIdx] || '');
    const mastered = masteredIdx < 0 || f[masteredIdx] === undefined ? null : f[masteredIdx].split(',').filter(Boolean).map(Number).filter(i => i >= 0 && i < TOPIC_TITLES.length);
    return {ok:true, name:f[nameIdx], cls:f[clsIdx], studentNumber:no, when: st.slice(0,4)+'/'+st.slice(4,6)+'/'+st.slice(6,8)+' '+st.slice(8,10)+':'+st.slice(10,12), c:+f[cIdx], n:+f[nIdx], m:f[mIdx], mastered};
  });
  const agg = {};
  rows.filter(r => r.ok).forEach(r => {
    const k = r.name + '|' + r.cls + '|' + r.studentNumber;
    const a = agg[k] = agg[k] || {name:r.name, cls:r.cls, studentNumber:r.studentNumber, sessions:0, n:0, c:0, mastered:new Set()};
    a.sessions++; a.n += r.n; a.c += r.c;
    if(r.mastered) r.mastered.forEach(i => a.mastered.add(i));
  });
  if(toks.length){
    lastVerifyResults = {rows, agg};
    document.getElementById('t-filter').classList.remove('hidden');
    renderTeacherResults();
  }else{
    lastVerifyResults = null;
    document.getElementById('t-filter').classList.add('hidden');
    document.getElementById('t-out').innerHTML = '<p style="color:var(--sub)">لم أجد رموزاً صالحة في النص.</p>';
  }
  const exportBar = document.getElementById('t-export');
  if(toks.length){ lastVerifyResults = {rows, agg}; exportBar.classList.remove('hidden'); }
  else { lastVerifyResults = null; exportBar.classList.add('hidden'); }
}
function masteryNames(value){
  if(value === null) return '—';
  const ids = value instanceof Set ? [...value] : value;
  return ids && ids.length ? ids.map(i => esc(TOPIC_TITLES[i])).join('، ') : 'لا يوجد باب متقن بالكامل بعد';
}

let lastDownload = null;
function downloadBlob(blob, filename){
  try{
    const url = URL.createObjectURL(blob);
    if(lastDownload) URL.revokeObjectURL(lastDownload.url);
    lastDownload = {url, filename};
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

function figArrow(tx, ty, hx, hy){
  const dx = hx - tx, dy = hy - ty, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const ah = 17, aw = 9, bx = hx - ux * ah, by = hy - uy * ah;
  const p1 = [bx - uy * aw, by + ux * aw], p2 = [bx + uy * aw, by - ux * aw];
  const head = `${hx},${hy} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`;
  return `<g>
    <line x1="${tx}" y1="${ty}" x2="${bx}" y2="${by}" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <polygon points="${head}" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <line x1="${tx}" y1="${ty}" x2="${bx}" y2="${by}" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="${head}" fill="#e11d48" stroke="#e11d48" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="${tx}" cy="${ty}" r="4.5" fill="#e11d48" stroke="#fff" stroke-width="2"/></g>`;
}
function figSVG(id, o){
  o = o || {};
  const f = FIGS[id]; if(!f) return '';
  let extra = '';
  if(o.target){
    const p = f.parts.find(x => x.k === o.target);
    if(p) extra += figArrow(p.tail[0], p.tail[1], p.tip[0], p.tip[1]);
  }
  if(o.numbers){
    f.parts.forEach((p, i) => {
      const st = o.marks && o.marks[p.k];
      const fill = st === 'ok' ? '#0ea472' : st === 'bad' ? '#e11d48' : (o.sel === p.k ? '#f59e0b' : '#1d4ed8');
      const clickable = !st;
      extra += `<g${clickable ? ` onclick="labSelect('${p.k}')" style="cursor:pointer"` : ''}><circle cx="${p.tip[0]}" cy="${p.tip[1]}" r="14" fill="${fill}" stroke="#fff" stroke-width="3"/><text x="${p.tip[0]}" y="${p.tip[1]+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" style="pointer-events:none">${arNum(i+1)}</text></g>`;
    });
  }
  return `<svg viewBox="0 0 ${f.w} ${f.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${f.title}" style="font-family:inherit"><rect x="0" y="0" width="${f.w}" height="${f.h}" rx="14" fill="#ffffff"/>${f.draw()}${extra}</svg>`;
}

function labOpen(id){
  const f = FIGS[id];
  state.lab = {fig:id, assign:{}, sel:f.parts[0].k, marks:{}, score:0, done:false, order: shuffleArr(f.parts.map(p => p.k))};
  state.screen = 'lab'; render();
}
function labSelect(k){
  const L = state.lab; if(!L || L.done || L.marks[k]) return;
  L.sel = k; render();
}
function labPick(name_k){
  const L = state.lab; if(!L || L.done) return;
  const f = FIGS[L.fig];
  let target = L.sel && !L.marks[L.sel] ? L.sel : f.parts.find(p => !L.marks[p.k] && !L.assign[p.k]) && f.parts.find(p => !L.marks[p.k]).k;
  if(!target || L.marks[target]) return;
  L.assign[target] = name_k;
  const good = name_k === target;
  L.marks[target] = good ? 'ok' : 'bad';
  if(good) L.score++;
  const q = BANK.find(x => x.k === 'fill' && x.fig && x.fig.id === L.fig && x.fig.part === target);
  if(q) recordResult(q, good);
  const next = f.parts.find(p => !L.marks[p.k]);
  L.sel = next ? next.k : null;
  L.lastPick = {target, good, name: f.parts.find(p => p.k === name_k).name};
  if(!next) L.done = true;
  render();
}

// ============================= بدء الجلسة =============================
function startQuiz(){
  if(needName()) return;
  if(state.selectedTopics.size===0 || state.selectedTypes.size===0){ alert('اختر موضوعاً ونوع أسئلة واحداً على الأقل.'); return; }
  let pool = buildQuestionPool([...state.selectedTopics], state.selectedTypes);
  pool = state.smart ? smartOrder(pool) : shuffleArr(pool);
  const n = parseInt(state.questionsCount, 10);
  if(n && n > 0) pool = pool.slice(0, n);
  if(pool.length === 0){ alert('لا توجد أسئلة متاحة بهذه الإعدادات، جرّب تغيير المواضيع أو الأنواع.'); return; }

  clearActiveQuiz();
  state.quiz = {
    questions: pool, index: 0, score: 0, answers: [],
    answered: false, timer: null, remaining: state.secondsPerQuestion,
    startedAt: Date.now(), matchState: null,
  };
  state.screen = 'quiz';
  render();
  if(state.mode === 'exam') startTimer();
}

function currentQ(){ return state.quiz.questions[state.quiz.index]; }

function startTimer(){
  clearInterval(state.quiz.timer);
  state.quiz.remaining = state.secondsPerQuestion;
  state.quiz.timer = setInterval(()=>{
    state.quiz.remaining--;
    const el = document.getElementById('timer-badge');
    if(el) el.textContent = '⏱️ ' + state.quiz.remaining + 'ث';
    if(state.quiz.remaining <= 0){
      clearInterval(state.quiz.timer);
      if(currentQ().kind==='fill' && !state.quiz.answered) gradeFill(); else if(!state.quiz.answered) lockAnswer(0, true);
      goNext(true);
    }
  }, 1000);
}

function progressPct(){
  const q = state.quiz;
  return Math.round(((q.index) / q.questions.length) * 100);
}

function renderQuiz(){
  const q = currentQ();
  const total = state.quiz.questions.length;
  const topBar = `
    <div class="flex items-center justify-between mb-2 text-sm">
      <div><b>${state.quiz.index+1}</b> / ${total}</div>
      <div class="flex items-center gap-2">
        ${state.mode==='exam' ? `<span id="timer-badge" class="badge" style="background:#fee2e2;color:#b91c1c">⏱️ ${state.quiz.remaining}ث</span>` : ''}
        <button onclick="cycleFont()" class="badge" style="background:#e2e8f0;color:#0f172a" title="تغيير حجم الخط">Aa</button>
        <span class="badge" style="background:#d1fae5;color:#047857">النقاط: ${Math.round(state.quiz.score*10)/10}</span>
      </div>
    </div>
    <div class="progress-track h-2 mb-4"><div class="progress-fill" style="width:${progressPct()}%"></div></div>
  `;

  const topicBadge = `<div class="badge mb-3" style="background:#eff6ff;color:#1d4ed8">📘 ${q.topic}</div>`;

  let body = '';
  if(q.kind === 'mcq') body = renderMCQ(q);
  else if(q.kind === 'tf') body = renderTF(q);
  else if(q.kind === 'fill') body = renderFill(q);
  else if(q.kind === 'recall') body = renderRecall(q);
  else if(q.kind === 'match') body = renderMatch(q);

  const navBar = `
    <div class="flex justify-between items-center mt-5">
      <button onclick="quitQuiz()" class="btn btn-outline text-sm py-2 px-4">🚪 إنهاء</button>
      <div class="flex gap-2">
        <button id="next-btn" onclick="goNext(false)" class="btn btn-brand text-sm py-2 px-5" ${needsAnswerFirst(q)?'disabled':''}>
          ${state.quiz.index === total-1 ? 'إنهاء وعرض النتيجة 🏁' : 'التالي ◀'}
        </button>
      </div>
    </div>`;

  app.innerHTML = `<div class="fade-in card p-4 md:p-7">${topBar}${topicBadge}${body}${navBar}</div>`;
}

function needsAnswerFirst(q){
  if(state.mode === 'exam') return false; // exam: can move on without forcing (timer covers it), but require some interaction for recall/match minimal
  return !state.quiz.answered;
}

// ---------- MCQ ----------
function renderMCQ(q){
  const given = state.quiz.answers[state.quiz.index];
  const choicesHtml = q.choices.map((c,ci)=>{
    let cls = '';
    if(state.quiz.answered){
      if(c === q.correct) cls = 'correct';
      else if(given && given.chosen === c) cls = 'wrong';
    }
    return `<button onclick="answerMCQ(${ci})" class="choice-btn ${cls}" ${state.quiz.answered?'disabled':''}>
      <span>${'أبجد'[ci]||''}</span><span>${c}</span>
    </button>`;
  }).join('');
  return `${figHTML(q)}<h3 class="text-lg md:text-xl font-extrabold mb-4 leading-relaxed">${q.prompt}</h3>
    <div class="grid gap-2">${choicesHtml}</div>
    ${state.quiz.answered ? feedbackLine(given && given.correct) : ''}`;
}
function answerMCQ(ci){
  if(state.quiz.answered) return;
  const q = currentQ();
  const chosen = q.choices[ci];
  const correct = chosen === q.correct;
  lockAnswer(correct ? 1 : 0, false, {chosen});
  render();
}

// ---------- TF ----------
function renderTF(q){
  const given = state.quiz.answers[state.quiz.index];
  function btnCls(val){
    if(!state.quiz.answered) return '';
    if(val === q.correct) return 'correct';
    if(given && given.chosen === val && val !== q.correct) return 'wrong';
    return '';
  }
  const head = q.qa
    ? `<div class="text-sm font-bold mb-1" style="color:var(--sub)">هل الإجابة المقترحة صحيحة؟</div>
       <h3 class="text-lg md:text-xl font-extrabold mb-2 leading-relaxed">${esc(q.qa)}</h3>
       <div class="p-3 rounded-xl mb-5 leading-relaxed" style="background:rgba(100,116,139,.12);border:1px dashed var(--line)"><span class="text-xs font-bold" style="color:var(--sub)">الإجابة المقترحة:</span><br>${esc(q.shown)}</div>`
    : `<div class="text-sm font-bold mb-1" style="color:var(--sub)">هل العبارة التالية صحيحة؟</div>
       <h3 class="text-lg md:text-xl font-extrabold mb-5 leading-relaxed">${esc(q.shown)}</h3>`;
  const fix = (state.quiz.answered && !q.correct)
    ? `<div class="mt-2 p-3 rounded-xl text-sm" style="background:rgba(14,164,114,.12)">الصياغة الصحيحة: <b>${esc(q.true)}</b></div>` : '';
  return `${head}
    <div class="grid grid-cols-2 gap-3">
      <button onclick="answerTF(true)" class="choice-btn justify-center ${btnCls(true)}" ${state.quiz.answered?'disabled':''}>✅ صح</button>
      <button onclick="answerTF(false)" class="choice-btn justify-center ${btnCls(false)}" ${state.quiz.answered?'disabled':''}>❌ خطأ</button>
    </div>
    ${state.quiz.answered ? feedbackLine(given && given.correct) + fix : ''}`;
}
function answerTF(val){
  if(state.quiz.answered) return;
  const q = currentQ();
  const correct = val === q.correct;
  lockAnswer(correct?1:0, false, {chosen:val});
  render();
}

// ---------- Fill in the blank ----------
function renderFill(q){
  const given = state.quiz.answers[state.quiz.index];
  const done = state.quiz.answered;
  const w = Math.max(8, Math.min(28, q.ans.length + 3));
  const cls = done ? (given && given.correct ? 'ok' : 'bad') : '';
  const inp = `<input id="fill-input" type="text" autocomplete="off" ${done?'disabled':''} value="${esc(given?given.typed||'':'')}"
      class="blank-line ${cls}" style="width:${w}ch" onkeydown="if(event.key==='Enter'){answerFill()}" aria-label="اكتب الإجابة في الفراغ">`;
  const ctx = q.ctx ? `<div class="text-sm font-bold mb-2" style="color:var(--sub)">${esc(q.ctx)}</div>` : '';
  return `${figHTML(q)}<div class="text-sm font-bold mb-1" style="color:var(--sub)">${q.fig ? 'اكتب اسم الجزء:' : 'أكمل الفراغ بالكلمة المناسبة:'}</div>
    ${ctx}
    <h3 class="text-lg md:text-xl font-extrabold mb-4 fill-sentence">${esc(q.pre)}${inp}${esc(q.post)}</h3>
    ${!done ? `<button onclick="answerFill()" class="btn btn-brand mt-2 w-full py-2.5">تحقق ✔️</button>` : `
      <div class="mt-3 p-3 rounded-xl" style="background:rgba(14,164,114,.12)">الإجابة الصحيحة: <b style="color:var(--brand-dark)">${esc(q.ans)}</b></div>
      ${feedbackLine(given && given.correct)}
      ${!(given && given.correct) ? `<button onclick="overrideFillCorrect()" class="btn btn-outline mt-2 text-xs py-1.5 px-3">إجابتي كانت صحيحة فعلياً (اعتمدها) ✔️</button>`:''}
    `}`;
}
function gradeFill(){
  if(state.quiz.answered) return;
  const input = document.getElementById('fill-input');
  const typed = input ? input.value.trim() : '';
  const q = currentQ();
  lockAnswer((fillOK(typed, q.ans) || (q.alt||[]).some(a => fillOK(typed, a))) ? 1 : 0, false, {typed});
}
function answerFill(){
  if(state.quiz.answered) return;
  gradeFill();
  render();
}
function overrideFillCorrect(){
  state.quiz.score += 1;
  state.quiz.answers[state.quiz.index].correct = true;
  recordResult(currentQ(), true);
  render();
}

// ---------- Recall (عرف / علل / اذكر) ----------
function renderRecall(q){
  const given = state.quiz.answers[state.quiz.index];
  const revealed = given && given.revealed;
  const subtypeLabel = {define:'🧩 عرّف', reason:'❓ علّل', explain:'💡 وضّح / اشرح', example:'🧮 مثال محلول', compare:'⚖️ قارن / وضّح', list:'📋 عدّد / اذكر'}[q.subtype] || 'سؤال';
  return `<div class="badge mb-2" style="background:#fef3c7;color:#92400e">${subtypeLabel}</div>
    <h3 class="text-lg md:text-xl font-extrabold mb-4 leading-relaxed">${q.prompt}</h3>
    <textarea id="recall-input" ${revealed?'disabled':''} rows="3"
      class="w-full border-2 rounded-xl px-4 py-3 bg-transparent" style="border-color:var(--line)"
      placeholder="اكتب إجابتك هنا ثم اضغط إظهار الإجابة النموذجية للمقارنة...">${given?given.typed||'':''}</textarea>
    ${!revealed ? `<button onclick="revealRecall()" class="btn btn-outline mt-3 w-full py-2.5">👁️ إظهار الإجابة النموذجية</button>` : `
      <div class="mt-3 p-3 rounded-xl fade-in" style="background:#f0fdf4;border:1px solid #bbf7d0">
        <div class="text-xs font-bold mb-1" style="color:var(--brand-dark)">الإجابة النموذجية:</div>
        <div style="white-space:pre-line">${esc(q.answer)}</div>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <button onclick="markRecall(true)" class="btn ${given.marked==='y'?'btn-brand':'btn-outline'} py-2">أجبت بشكل صحيح ✅</button>
        <button onclick="markRecall(false)" class="btn ${given.marked==='n'?'btn-brand':'btn-outline'} py-2" style="${given.marked==='n'?'background:var(--danger);border-color:var(--danger)':''}">لم أُصب ❌</button>
      </div>
    `}`;
}
function revealRecall(){
  const input = document.getElementById('recall-input');
  const typed = input ? input.value.trim() : '';
  state.quiz.answers[state.quiz.index] = {revealed:true, typed, correct:false, marked:null};
  state.quiz.answered = false; // still need self-mark before moving on in practice mode
  render();
}
function markRecall(ok){
  const ans = state.quiz.answers[state.quiz.index];
  ans.marked = ok ? 'y' : 'n';
  if(!ans.locked){
    state.quiz.score += ok ? 1 : 0;
    ans.correct = ok;
    ans.locked = true;
    state.quiz.answered = true;
    recordResult(currentQ(), ok);
  }
  render();
}

// ---------- Match ----------
function renderMatch(q){
  if(!state.quiz.matchState || state.quiz.matchState.qIndex !== state.quiz.index){
    const left = q.pairs.map((p,i)=>({key:i, text:p[0]}));
    const right = shuffleArr(q.pairs.map((p,i)=>({key:i, text:p[1]})));
    state.quiz.matchState = {qIndex: state.quiz.index, left, right, selLeft:null, matched:{}, wrongFlash:null, mistakes:0};
  }
  const ms = state.quiz.matchState;
  const leftHtml = ms.left.map(item=>{
    const isMatched = ms.matched[item.key] !== undefined;
    const isSel = ms.selLeft === item.key;
    return `<div class="match-item ${isSel?'sel':''} ${isMatched?'done':''}" onclick="${isMatched?'':'selectMatchLeft('+item.key+')'}">${item.text}</div>`;
  }).join('');
  const rightHtml = ms.right.map(item=>{
    const isMatched = Object.values(ms.matched).includes(item.key);
    const isBad = ms.wrongFlash === item.key;
    return `<div class="match-item ${isMatched?'done':''} ${isBad?'bad':''}" onclick="${isMatched?'':'selectMatchRight('+item.key+')'}">${item.text}</div>`;
  }).join('');
  const doneCount = Object.keys(ms.matched).length;
  return `<h3 class="text-lg md:text-xl font-extrabold mb-1 leading-relaxed">${q.prompt}</h3>
    <p class="text-xs mb-4" style="color:var(--sub)">اضغط على عنصر من العمود الأيمن ثم ما يناسبه من الأيسر (${doneCount}/${ms.left.length})</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="grid gap-2">${leftHtml}</div>
      <div class="grid gap-2">${rightHtml}</div>
    </div>`;
}
function selectMatchLeft(key){
  const ms = state.quiz.matchState;
  if(ms.matched[key] !== undefined) return;
  ms.selLeft = key;
  render();
}
function selectMatchRight(rightKey){
  const ms = state.quiz.matchState;
  if(ms.selLeft === null) return;
  if(ms.selLeft === rightKey){
    ms.matched[ms.selLeft] = rightKey;
    ms.selLeft = null;
    if(Object.keys(ms.matched).length === ms.left.length){
      const q = currentQ();
      const frac = Math.max(0, 1 - ms.mistakes / q.pairs.length);
      lockAnswer(frac, false, {matchDone:true});
    }
  } else {
    ms.wrongFlash = rightKey; ms.mistakes++;
    setTimeout(()=>{ ms.wrongFlash=null; render(); }, 350);
    ms.selLeft = null;
  }
  render();
}

// ---------- مساعدات مشتركة ----------
function feedbackLine(correct){
  return `<div class="mt-3 font-extrabold ${correct?'':''}" style="color:${correct?'var(--brand-dark)':'var(--danger)'}">${correct? '✅ إجابة صحيحة! أحسنت' : '❌ إجابة غير صحيحة'}</div>`;
}
function lockAnswer(scoreVal, timedOut, extra){
  const q = currentQ();
  state.quiz.score += scoreVal;
  state.quiz.answers[state.quiz.index] = Object.assign({correct: scoreVal>=1, scoreVal, timedOut}, extra||{});
  state.quiz.answered = true;
  recordResult(q, scoreVal >= 0.7);
  if(state.mode==='exam') clearInterval(state.quiz.timer);
}

function goNext(auto){
  const q = currentQ();
  // لضمان وجود إجابة مسجّلة قبل الانتقال في وضع الاختبار لو لم يُجب
  if(state.mode==='exam' && q.kind==='fill' && !state.quiz.answered && !state.quiz.answers[state.quiz.index]) gradeFill();
  if(!state.quiz.answers[state.quiz.index] && state.mode==='exam'){
    state.quiz.answers[state.quiz.index] = {correct:false, scoreVal:0, skipped:true};
  }
  if(state.quiz.index < state.quiz.questions.length - 1){
    state.quiz.index++;
    state.quiz.answered = false;
    render();
    if(state.mode === 'exam') startTimer();
  } else {
    finishQuiz();
  }
}
function quitQuiz(){
  if(confirm('هل تريد إنهاء الجلسة الآن وعرض النتيجة؟')) finishQuiz();
}
function finishQuiz(){
  clearInterval(state.quiz.timer);
  saveSession();
  clearActiveQuiz();
  if(!state.quiz.token) state.quiz.token = makeToken();
  saveLastResult();
  state.screen = 'result';
  render();
}

// ============================= النتيجة =============================
function saveSession(){
  try{
    const q = state.quiz;
    const total = q.questions.length;
    const percent = Math.round((q.score/total)*1000)/10;
    const session = {
       date: new Date().toISOString(), studentName: state.studentName, studentClass: state.studentClass, studentNumber: state.studentNumber,
      mode: state.mode, total, score: Math.round(q.score*10)/10, percent,
      topics: [...state.selectedTopics].map(i=>TOPIC_TITLES[i]),
    };
    let list = [];
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ try{ list = JSON.parse(raw); if(!Array.isArray(list)) list=[]; }catch(e){ list=[]; } }
    list.push(session);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }catch(e){ console.error('storage error', e); }
}

function renderResult(){
  const q = state.quiz;
  const total = q.questions.length;
  const percent = Math.round((q.score/total)*1000)/10;
  let emoji = '💪', msg = 'استمر في المحاولة، أنت تتحسن!';
  if(percent >= 90){ emoji='🏆'; msg='ممتاز جداً! إتقان رائع للملخص'; }
  else if(percent >= 75){ emoji='🌟'; msg='أداء جيد جداً، اقترب من الإتقان الكامل'; }
  else if(percent >= 50){ emoji='👍'; msg='جيد، صحّح أخطاءك لتتقدم أكثر'; }
  const wrong = q.questions.filter((qq,i) => !(q.answers[i] && q.answers[i].correct));
  const byTopic = {}; wrong.forEach(qq => byTopic[qq.topic] = (byTopic[qq.topic]||0) + 1);
  const wrongHTML = wrong.length
    ? `<div class="p-4 rounded-xl mb-4 text-right" style="background:rgba(225,29,72,.08);border:1px solid rgba(225,29,72,.3)">
        <h3 class="font-extrabold mb-1">❌ أخطأتَ في ${wrong.length===1?'سؤال واحد':wrong.length===2?'سؤالين':wrong.length<=10?wrong.length+' أسئلة':wrong.length+' سؤالاً'}</h3>
        <p class="text-sm mb-3">${Object.entries(byTopic).map(([t,n]) => esc(t) + ' (' + n + ')').join(' · ')}</p>
        <button onclick="retryWrong()" class="btn btn-brand w-full py-3 text-lg">🎯 صحّح أخطاءك الآن</button>
        <p class="text-xs mt-2" style="color:var(--sub)">أجب عنها من جديد داخل التطبيق. وتُحفظ في دفتر الأخطاء ليعود إليك كل سؤال في الوقت المناسب.</p></div>`
    : `<div class="p-4 rounded-xl mb-4" style="background:rgba(14,164,114,.12)">🎉 لا أخطاء في هذه الجلسة، أحسنت!</div>`;
  if(!q.token) q.token = makeToken();
  const correctN = q.answers.filter(a => a && a.correct).length;
  const cert = `<div class="p-4 rounded-xl text-right" style="border:2px dashed var(--brand)">
      <h3 class="font-extrabold mb-1">🏅 رمز الإنجاز</h3>
       <p class="text-sm mb-2" style="color:var(--sub)">${esc(state.studentName)} ${state.studentNumber ? '· ' + esc(state.studentNumber) : ''} ${state.studentClass ? '· ' + esc(state.studentClass) : ''} · ${correctN} صحيحة من ${total}</p>
       <div class="selectable p-2 rounded-lg text-xs mb-2" style="background:rgba(100,116,139,.12);font-family:monospace;direction:ltr;text-align:left;white-space:nowrap;overflow-x:auto;max-width:100%">${q.token}</div>
      <div class="flex gap-2 justify-center flex-wrap">
        <button id="sendTokenBtn" onclick="sendTokenToTeacher()" class="btn btn-brand text-sm py-2 px-5">📤 إرسال الرمز إلى المعلم</button>
        <button onclick="copyToken()" class="btn btn-outline text-sm py-2 px-4">📋 نسخ الرمز (احتياطي)</button>
      </div>
      <div id="sendTokenMsg" class="text-xs mt-2"></div></div>`;
  app.innerHTML = `<div class="fade-in card p-5 md:p-8 text-center">
    <div class="text-6xl mb-2">${emoji}</div>
    <h2 class="text-2xl font-black mb-1">النتيجة النهائية</h2>
     <p class="mb-4" style="color:var(--sub)">${esc(state.studentName)}${state.studentNumber ? ' — ' + esc(state.studentNumber) : ''}${state.studentClass ? ' — ' + esc(state.studentClass) : ''}</p>
    <div class="text-5xl font-black mb-2" style="color:var(--brand-dark)">${percent}%</div>
    <p class="mb-4 font-bold">${Math.round(q.score*10)/10} من ${total} — ${msg}</p>
    ${wrongHTML}
    ${cert}
    <div class="flex gap-3 justify-center flex-wrap mt-5">
      <button onclick="restartSameQuiz()" class="btn btn-outline py-2.5 px-6">🔁 إعادة الجلسة</button>
      <button onclick="backToSetup()" class="btn btn-outline py-2.5 px-6">🏠 الشاشة الرئيسية</button>
      <button onclick="state.screen='book';render()" class="btn btn-outline py-2.5 px-6">📕 دفتر الأخطاء</button>
    </div></div>`;
}

function restartSameQuiz(){
  const prevQs = shuffleArr(state.quiz.questions);
  clearActiveQuiz();
  state.quiz = { questions: prevQs, index:0, score:0, answers:[], answered:false, timer:null, remaining: state.secondsPerQuestion, startedAt: Date.now(), matchState:null };
  state.screen = 'quiz';
  render();
  if(state.mode==='exam') startTimer();
}
function backToSetup(){
  state.screen = 'setup';
  render();
}

// ============================= بطاقات المراجعة السريعة =============================
function startFlash(){
  let cards = BANK.filter(q => q.k==='recall' && state.selectedTopics.has(q.t) && isTopicEnabled(q.t,'practice'))
    .map(q => ({q: q.prompt, a: q.answer, topic: TOPIC_TITLES[q.t]}));
  cards = shuffleArr(cards);
  if(cards.length===0){ alert('اختر موضوعاً واحداً على الأقل'); return; }
  state.flash = { cards, index:0, flipped:false };
  state.screen = 'flash';
  render();
}
function renderFlash(){
  const f = state.flash;
  const c = f.cards[f.index];
  app.innerHTML = `<div class="fade-in">
    <div class="flex items-center justify-between mb-3 text-sm">
      <button onclick="backToSetup()" class="btn btn-outline py-1.5 px-4 text-xs">🚪 خروج</button>
      <div class="badge" style="background:#eff6ff;color:#1d4ed8">📘 ${c.topic}</div>
      <div>${f.index+1} / ${f.cards.length}</div>
    </div>
    <div class="flip-card ${f.flipped?'flipped':''}" onclick="flipCard()">
      <div class="flip-inner card" style="min-height:260px">
        <div class="flip-face"><div class="text-lg md:text-2xl font-extrabold">${esc(c.q)}</div></div>
        <div class="flip-face flip-back" style="background:#ecfdf5"><div class="text-base md:text-lg font-bold" style="white-space:pre-line">${esc(c.a)}</div></div>
      </div>
    </div>
    <p class="text-center text-xs mt-2" style="color:var(--sub)">اضغط على البطاقة لقلبها</p>
    <div class="flex gap-3 justify-center mt-5">
      <button onclick="flashPrev()" class="btn btn-outline py-2 px-5">▶ السابق</button>
      <button onclick="flashNext()" class="btn btn-brand py-2 px-5">التالي ◀</button>
    </div>
  </div>`;
}
function flipCard(){ state.flash.flipped = !state.flash.flipped; render(); }
function flashNext(){
  state.flash.index = (state.flash.index+1) % state.flash.cards.length;
  state.flash.flipped = false;
  render();
}
function flashPrev(){
  state.flash.index = (state.flash.index-1+state.flash.cards.length) % state.flash.cards.length;
  state.flash.flipped = false;
  render();
}

// ============================= الإقلاع =============================
loadAll(); applyFont();
loadCachedConfig();
loadCachedTask();
applyMonthlyPlanDefaultIfFresh();
fetchRemoteConfigSilently();
if(window.firebase && firebase.auth){
  firebase.auth().onAuthStateChanged(() => { if(state.screen === 'admin') render(); });
}
state.studentName = SETT.name || ''; state.studentClass = SETT.cls || ''; state.studentNumber = SETT.studentNumber || '';
if(location.hash === '#teacher') state.screen = 'teacher';
if(location.hash === '#admin') state.screen = 'admin';
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();

</script>
</body>
